<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Premium | Insight Esports</title>
<!--
  Embedded Stripe Checkout for insightesportsapp.com (drop-in reference).

  The customer never leaves the website: Stripe.js renders the payment form
  inside the #checkout box below. Flow:
    1. the page reads the publishable key from  GET /api/payments/config
    2. the signed-in user clicks Subscribe ->  POST /api/payments/checkout
       with body {"mode":"embedded"}  -> { clientSecret }
    3. stripe.initEmbeddedCheckout({ clientSecret }).mount('#checkout')
    4. on completion Stripe calls onComplete here; premium is granted by the
       webhook within seconds, so the page polls GET /api/payments/status
       and shows the subscribed state.

  Requirements:
    - the user must be signed in on the website (Supabase session) so the
      page can send  Authorization: Bearer <access token>;
    - API_KEY below is the website's x-api-key (same as today's checkout
      button); API_BASE is the backend;
    - Railway: STRIPE_PUBLISHABLE_KEY=pk_test_... (pk_live_... in live mode)
      and optionally STRIPE_EMBEDDED_RETURN_URL=https://insightesportsapp.com/premium?done=1
    - Stripe dashboard > Settings > Branding sets the colours/logo the form
      uses, so it matches the site.
  Styling here is a neutral dark card; keep or replace with the site's CSS.
-->
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root { --bg:#0b0b10; --card:#15151d; --line:#26262f; --text:#f2f2f5; --muted:#b8b8c4; --accent:#7c5cff; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:32px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { font-size:24px; margin:0 0 8px; } p { color:var(--muted); line-height:1.5; margin:0 0 16px; }
  .price { font-size:32px; font-weight:700; margin:8px 0 16px; } .price small { font-size:14px; color:var(--muted); font-weight:400; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 20px; font-size:16px; font-weight:600; cursor:pointer; width:100%; }
  button[disabled] { opacity:.6; cursor:default; }
  #checkout { margin-top:16px; min-height:0; }
  .status { margin-top:12px; font-size:14px; color:var(--muted); } .ok { color:#4cd38a; } .err { color:#ff6b6b; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Insight Premium</h1>
    <p>Live win probability, stat predictions and more, across every game.</p>
    <div class="price">$4.99 <small>/ month, cancel any time</small></div>

    <div id="start">
      <button id="subscribe">Subscribe</button>
      <div id="status" class="status"></div>
    </div>

    <!-- Stripe mounts the payment form here; nothing leaves the page. -->
    <div id="checkout" class="hidden"></div>

    <div id="done" class="hidden">
      <p class="ok">You are premium. Thanks for supporting Insight.</p>
      <button id="manage">Manage subscription</button>
      <div id="doneStatus" class="status"></div>
    </div>
  </div>
</div>

<script>
(async () => {
  // ── wire these to the site ─────────────────────────────────────────────
  const API_BASE = 'https://esports-app-production.up.railway.app';
  const API_KEY  = window.INSIGHT_API_KEY || '';              // the website's x-api-key
  const getAccessToken = async () => window.INSIGHT_ACCESS_TOKEN || null;   // the signed-in user's Supabase access token
  // ───────────────────────────────────────────────────────────────────────

  const $ = (id) => document.getElementById(id);
  const say = (el, text, cls) => { el.textContent = text; el.className = 'status' + (cls ? ' ' + cls : ''); };
  const api = async (method, path, body) => {
    const token = await getAccessToken();
    const r = await fetch(API_BASE + path, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY, ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  };

  // Already premium? Show the subscribed state straight away.
  const showDone = (s) => {
    $('start').classList.add('hidden'); $('checkout').classList.add('hidden'); $('done').classList.remove('hidden');
    if (s && s.currentPeriodEnd) say($('doneStatus'), (s.autoRenew === false ? 'Ends ' : 'Renews ') + new Date(s.currentPeriodEnd).toLocaleDateString());
  };
  try {
    if (await getAccessToken()) { const s = await api('GET', '/api/payments/status'); if (s.isPremium) showDone(s); }
  } catch (e) { /* not signed in yet; the button will say so */ }

  let stripe = null;
  try { const cfg = await api('GET', '/api/payments/config'); if (cfg.publishableKey) stripe = Stripe(cfg.publishableKey); }
  catch (e) { say($('status'), 'Payments are temporarily unavailable.', 'err'); }

  let embedded = null;
  $('subscribe').addEventListener('click', async () => {
    if (!(await getAccessToken())) { say($('status'), 'Please sign in first.', 'err'); return; }
    if (!stripe) { say($('status'), 'Payments are temporarily unavailable.', 'err'); return; }
    $('subscribe').disabled = true; say($('status'), 'Loading secure checkout…');
    try {
      const { clientSecret } = await api('POST', '/api/payments/checkout', { mode: 'embedded' });
      if (embedded) { embedded.destroy(); embedded = null; }
      embedded = await stripe.initEmbeddedCheckout({
        clientSecret,
        onComplete: async () => {
          // Paid. Premium arrives through the webhook within a few seconds.
          say($('status'), 'Payment received, activating…');
          for (let i = 0; i < 20; i++) {
            await new Promise((r) => setTimeout(r, 1500));
            try { const s = await api('GET', '/api/payments/status'); if (s.isPremium) { showDone(s); return; } } catch (e) { /* retry */ }
          }
          say($('status'), 'Payment received. Your premium access will show within a minute.', 'ok');
        }
      });
      $('start').classList.add('hidden'); $('checkout').classList.remove('hidden');
      embedded.mount('#checkout');
    } catch (e) {
      $('subscribe').disabled = false;
      say($('status'), e.message === 'You are already a premium subscriber' ? e.message : 'Could not start checkout: ' + e.message, 'err');
    }
  });

  $('manage').addEventListener('click', async () => {
    try { const { portalUrl } = await api('POST', '/api/payments/portal'); window.location.href = portalUrl; }
    catch (e) { say($('doneStatus'), 'Could not open the billing portal: ' + e.message, 'err'); }
  });
})();
</script>
</body>
</html>
